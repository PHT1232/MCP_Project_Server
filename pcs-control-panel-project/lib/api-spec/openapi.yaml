openapi: 3.1.0
info:
  # Do not change the title — orval output paths assume "Api"
  title: Api
  version: 0.1.0
  description: >
    PCS HTTP API consumed by the Atlas Console control panel.
    Field names and shapes mirror web/src/api/types.ts (and T20 AiSettings
    types for /admin/ai-settings). Paths mirror web/src/api/client.ts.
servers:
  - url: /api
    description: Base API path (Vite proxies /api → PCS :8080)
tags:
  - name: health
  - name: admin
  - name: projects
  - name: context
  - name: requirements
  - name: index
  - name: codemap

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Process health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /admin/ai-settings:
    get:
      operationId: getAiSettings
      tags: [admin]
      summary: Read global AI provider settings (T20 / AC-AISET-8)
      responses:
        "200":
          description: Current embedding + summary settings (no secrets)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "400":
          description: Invalid runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      operationId: updateAiSettings
      tags: [admin]
      summary: Merge-update AI provider settings (T20 / AC-AISET-9)
      parameters:
        - $ref: "#/components/parameters/PcsAdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "401":
          description: Admin token missing or wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List registered projects (FR31)
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: registerProject
      tags: [projects]
      summary: Register a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProjectInput"
      responses:
        "200":
          description: Registered project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/briefing:
    get:
      operationId: getBriefing
      tags: [context]
      summary: Assembled project briefing
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      responses:
        "200":
          description: Briefing markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "404":
          description: Unknown project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/sections/{section}:
    get:
      operationId: getSection
      tags: [context]
      summary: One dashboard section with entries (FR36)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - name: section
          in: path
          required: true
          schema:
            type: string
        - name: include_resolved
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Section entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Unknown project or section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/entries:
    post:
      operationId: addEntry
      tags: [context]
      summary: Create an entry (FR36)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "200":
          description: Created entry (+ optional requirements file sync)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryWriteResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/entries/{entryId}:
    patch:
      operationId: updateEntry
      tags: [context]
      summary: Merge-update an entry (FR36)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryWriteResponse"
        "404":
          description: Unknown entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/entries/{entryId}/resolve:
    post:
      operationId: resolveEntry
      tags: [context]
      summary: Resolve an entry (FR36)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Resolved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryWriteResponse"
        "404":
          description: Unknown entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/focus:
    put:
      operationId: setFocus
      tags: [context]
      summary: Replace current focus (FR36 replace-semantics)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFocusInput"
      responses:
        "200":
          description: Updated project row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid focus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/requirements:
    get:
      operationId: listRequirements
      tags: [requirements]
      summary: Requirements list with done/total (FR36a)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementsResponse"

  /projects/{project}/requirements/{requirementId}/contract:
    get:
      operationId: getRequirementContract
      tags: [requirements]
      summary: Verbatim contract drill-down (T13)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/RequirementId"
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementContract"

  /projects/{project}/requirements/{requirementId}/invariants:
    post:
      operationId: createRequirementInvariant
      tags: [requirements]
      summary: Create an invariant (T14)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/RequirementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvariantInput"
      responses:
        "200":
          description: Created invariant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementInvariant"

  /projects/{project}/requirements/invariants/{invariantId}:
    patch:
      operationId: updateRequirementInvariant
      tags: [requirements]
      summary: Merge-update an invariant (T14)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/InvariantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvariantInput"
      responses:
        "200":
          description: Updated invariant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementInvariant"
    delete:
      operationId: deleteRequirementInvariant
      tags: [requirements]
      summary: Soft-delete an invariant (T14)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/InvariantId"
      responses:
        "200":
          description: Soft-deleted invariant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementInvariant"

  /projects/{project}/requirements/invariants/{invariantId}/criteria:
    post:
      operationId: createAcceptanceCriterion
      tags: [requirements]
      summary: Create an acceptance criterion (T14)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/InvariantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCriterionInput"
      responses:
        "200":
          description: Created criterion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceCriterion"

  /projects/{project}/requirements/criteria/{criterionId}:
    patch:
      operationId: updateAcceptanceCriterion
      tags: [requirements]
      summary: Merge-update a criterion (T14)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/CriterionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCriterionInput"
      responses:
        "200":
          description: Updated criterion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceCriterion"
    delete:
      operationId: deleteAcceptanceCriterion
      tags: [requirements]
      summary: Soft-delete a criterion (T14)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/CriterionId"
      responses:
        "200":
          description: Soft-deleted criterion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceCriterion"

  /projects/{project}/requirements/{requirementId}/evidence:
    get:
      operationId: getRequirementEvidence
      tags: [requirements]
      summary: Compact evidence + close gate (T13)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/RequirementId"
      responses:
        "200":
          description: Evidence drill-down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementEvidenceResponse"

  /projects/{project}/requirements/compliance:
    get:
      operationId: reviewRequirementCompliance
      tags: [requirements]
      summary: Exception-only compliance review (T13)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - name: requirement_id
          in: query
          required: true
          description: Repeatable — one or more requirement entry IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Compliance rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementComplianceResponse"

  /projects/{project}/requirements/sync:
    post:
      operationId: syncRequirements
      tags: [requirements]
      summary: Re-parse requirements file and reconcile (AC18)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncReport"

  /projects/{project}/index:
    get:
      operationId: getIndexStatus
      tags: [index]
      summary: Index status (FR37)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      responses:
        "200":
          description: Index status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"

  /projects/{project}/reindex:
    post:
      operationId: reindex
      tags: [index]
      summary: Trigger index rebuild (FR37)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexInput"
      responses:
        "200":
          description: Index status after kickoff / completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"

  /projects/{project}/code-map:
    get:
      operationId: getCodeMap
      tags: [codemap]
      summary: One tier of the code map (FR32 / FR32a)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: depth
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Code map tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeMap"

  /projects/{project}/source:
    get:
      operationId: getSource
      tags: [codemap]
      summary: Read-only file source (FR34)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFile"
        "404":
          description: Path not indexed / not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /projects/{project}/search:
    get:
      operationId: searchCode
      tags: [codemap]
      summary: Hybrid keyword + semantic search (FR35)
      parameters:
        - $ref: "#/components/parameters/ProjectRef"
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [project, subtree, files, focus]
        - name: subtree
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

components:
  parameters:
    ProjectRef:
      name: project
      in: path
      required: true
      description: Project name or id (URL-encoded by the client)
      schema:
        type: string
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema:
        type: string
    InvariantId:
      name: invariantId
      in: path
      required: true
      schema:
        type: string
    CriterionId:
      name: criterionId
      in: path
      required: true
      schema:
        type: string
    PcsAdminToken:
      name: x-pcs-admin-token
      in: header
      required: true
      description: Admin token for mutating AI settings
      schema:
        type: string

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
        available:
          type: array
          items:
            type: string
      additionalProperties: true

    Health:
      type: object
      required: [status, bind_mode, bind_host]
      properties:
        status:
          type: string
        bind_mode:
          type: string
        bind_host:
          type: string

    AiSettingSource:
      type: string
      enum: [persisted, environment, default]

    EmbeddingSettings:
      type: object
      required:
        - backend
        - base_url
        - model
        - dimensions
        - batch_size
        - timeout_seconds
        - api_key_configured
        - source
      properties:
        backend:
          type: string
        base_url:
          type: string
        model:
          type: string
        dimensions:
          type: number
        batch_size:
          type: number
        timeout_seconds:
          type: number
        api_key_configured:
          type: boolean
        source:
          $ref: "#/components/schemas/AiSettingSource"

    SummarySettings:
      type: object
      required:
        - backend
        - base_url
        - model
        - timeout_seconds
        - api_key_configured
        - source
      properties:
        backend:
          type: string
        base_url:
          type: string
        model:
          type: string
        timeout_seconds:
          type: number
        api_key_configured:
          type: boolean
        source:
          $ref: "#/components/schemas/AiSettingSource"

    AiSettings:
      type: object
      required: [embedding, summary, reindex_required]
      properties:
        embedding:
          $ref: "#/components/schemas/EmbeddingSettings"
        summary:
          $ref: "#/components/schemas/SummarySettings"
        reindex_required:
          type: boolean

    EmbeddingSettingsInput:
      type: object
      required:
        - backend
        - base_url
        - model
        - dimensions
        - batch_size
        - timeout_seconds
      properties:
        backend:
          type: string
        base_url:
          type: string
        model:
          type: string
        dimensions:
          type: number
        batch_size:
          type: number
        timeout_seconds:
          type: number
        api_key:
          type: string
          nullable: true

    SummarySettingsInput:
      type: object
      required: [backend, base_url, model, timeout_seconds]
      properties:
        backend:
          type: string
        base_url:
          type: string
        model:
          type: string
        timeout_seconds:
          type: number
        api_key:
          type: string
          nullable: true

    AiSettingsInput:
      type: object
      properties:
        embedding:
          $ref: "#/components/schemas/EmbeddingSettingsInput"
        summary:
          $ref: "#/components/schemas/SummarySettingsInput"

    Project:
      type: object
      required:
        - id
        - name
        - root_path
        - status_line
        - briefing_token_budget
        - prepare_task_token_budget
        - headline_max_chars
        - detail_max_chars
        - expiry_policy
        - expiry_days
      properties:
        id:
          type: string
        name:
          type: string
        root_path:
          type: string
        status_line:
          type: string
        briefing_token_budget:
          type: number
        prepare_task_token_budget:
          type: number
        headline_max_chars:
          type: number
        detail_max_chars:
          type: number
        expiry_policy:
          type: string
        expiry_days:
          type: number
          nullable: true

    Briefing:
      type: object
      required: [project, briefing]
      properties:
        project:
          type: string
        briefing:
          type: string

    RegisterProjectInput:
      type: object
      required: [name, root_path, overview]
      properties:
        name:
          type: string
        root_path:
          type: string
        overview:
          type: string

    EntryLifecycle:
      type: string
      enum: [open, resolved, deleted, archived]

    RequirementStatus:
      type: string
      enum: [not-started, in-progress, blocked, done]

    Entry:
      type: object
      required:
        - id
        - project_id
        - section
        - headline
        - detail
        - status
        - priority
        - author
        - created_at
        - updated_at
        - requirement_status
        - linked_files
        - related_entry_id
        - req_key
      properties:
        id:
          type: string
        project_id:
          type: string
        section:
          type: string
        headline:
          type: string
        detail:
          type: string
        status:
          $ref: "#/components/schemas/EntryLifecycle"
        priority:
          type: number
        author:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        requirement_status:
          allOf:
            - $ref: "#/components/schemas/RequirementStatus"
          nullable: true
        linked_files:
          type: array
          items:
            type: string
        related_entry_id:
          type: string
          nullable: true
        req_key:
          type: string
          nullable: true

    SectionResponse:
      type: object
      required: [section, entries]
      properties:
        section:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    EntryInput:
      type: object
      properties:
        section:
          type: string
        headline:
          type: string
        detail:
          type: string
        priority:
          type: number
        status:
          $ref: "#/components/schemas/RequirementStatus"
        linked_files:
          type: array
          items:
            type: string

    ReconciliationNote:
      type: object
      required: [req_key, message]
      properties:
        req_key:
          type: string
        message:
          type: string

    RequirementsFileSync:
      type: object
      required: [path, written, writable, errors, reconciliations]
      properties:
        path:
          type: string
        written:
          type: boolean
        writable:
          type: boolean
        errors:
          type: array
          items:
            type: string
        reconciliations:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationNote"

    EntryWriteResponse:
      allOf:
        - $ref: "#/components/schemas/Entry"
        - type: object
          properties:
            requirements_file:
              $ref: "#/components/schemas/RequirementsFileSync"

    SetFocusInput:
      type: object
      required: [text]
      properties:
        text:
          type: string

    Requirement:
      type: object
      required:
        - req_key
        - entry_id
        - title
        - status
        - lifecycle
        - linked_files
      properties:
        req_key:
          type: string
        entry_id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/RequirementStatus"
        lifecycle:
          type: string
        linked_files:
          type: array
          items:
            type: string

    RequirementsResponse:
      type: object
      required: [requirements, done_count, total_count]
      properties:
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        done_count:
          type: number
        total_count:
          type: number

    SyncReport:
      type: object
      required:
        - project_id
        - project_name
        - file_path
        - ok
        - file_existed
        - file_written
        - file_writable
        - created
        - updated
        - archived
        - written_back
        - reconciliations
        - errors
        - requirements
        - done_count
        - total_count
      properties:
        project_id:
          type: string
        project_name:
          type: string
        file_path:
          type: string
        ok:
          type: boolean
        file_existed:
          type: boolean
        file_written:
          type: boolean
        file_writable:
          type: boolean
        created:
          type: array
          items:
            type: string
        updated:
          type: array
          items:
            type: string
        archived:
          type: array
          items:
            type: string
        written_back:
          type: array
          items:
            type: string
        reconciliations:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationNote"
        errors:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        done_count:
          type: number
        total_count:
          type: number

    SkippedFile:
      type: object
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string

    IndexStatus:
      type: object
      required:
        - project_id
        - project_name
        - state
        - last_full_at
        - last_incremental_at
        - last_commit
        - file_count
        - chunk_count
        - skipped_count
        - skipped
        - semantic_available
      properties:
        project_id:
          type: string
        project_name:
          type: string
        state:
          type: string
        last_full_at:
          type: string
