[project]
name = "pcs"
version = "0.0.0"
description = "Project Context MCP Server — walking skeleton (T00)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.13,<2",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.1",
    "uvicorn>=0.34.0",
    "starlette>=0.46.0",
    "pathspec>=1.1.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7,<0.8",
    "watchfiles>=1.2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.9.1",
    "mypy>=1.14.1",
]

[project.scripts]
pcs = "pcs.__main__:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pcs"
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/pcs/alembic/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
exclude = ["^src/pcs/alembic/env\\.py$"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pathspec", "pathspec.*", "tree_sitter_language_pack", "watchfiles"]
ignore_missing_imports = true
